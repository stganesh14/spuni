{% extends "_base.html" %}
{% from "_macros.html" import button %}
{% block content %}
<p style="margin:0 0 6px 0;font-size:12px;letter-spacing:3px;color:#9a7853;text-transform:uppercase;">Admin alert</p>
<h1 style="margin:0 0 18px 0;font-weight:normal;font-size:24px;">{{ headline }}</h1>
{% for line in lines %}<p style="margin:4px 0;font-family:Helvetica,Arial,sans-serif;font-size:13px;">{{ line }}</p>{% endfor %}
{% if url %}{{ button(url, "Open in admin") }}{% endif %}
{% endblock %}
